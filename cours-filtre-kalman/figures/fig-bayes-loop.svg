<svg viewBox="0 0 720 300" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, sans-serif" role="img"><rect x="90.0" y="70.0" width="210.0" height="92.0" rx="10" fill="#122033" stroke="#3987e5" stroke-width="1.6" opacity="1.00"/><rect x="420.0" y="70.0" width="210.0" height="92.0" rx="10" fill="#12271f" stroke="#35c98b" stroke-width="1.6" opacity="1.00"/><text x="195.0" y="96.0" fill="#3987e5" font-size="15" text-anchor="middle" font-weight="700">PRÉDICTION</text><text x="195.0" y="120.0" fill="#cfe3ff" font-size="14" text-anchor="middle" font-weight="400" font-family="JetBrains Mono, monospace">x⁻ = F·x + B·u</text><text x="195.0" y="142.0" fill="#cfe3ff" font-size="14" text-anchor="middle" font-weight="400" font-family="JetBrains Mono, monospace">P⁻ = F·P·Fᵀ + Q</text><text x="525.0" y="96.0" fill="#35c98b" font-size="15" text-anchor="middle" font-weight="700">CORRECTION</text><text x="525.0" y="120.0" fill="#d6f5e6" font-size="13.5" text-anchor="middle" font-weight="400" font-family="JetBrains Mono, monospace">K = P⁻Hᵀ (H P⁻Hᵀ+R)⁻¹</text><text x="525.0" y="142.0" fill="#d6f5e6" font-size="13.5" text-anchor="middle" font-weight="400" font-family="JetBrains Mono, monospace">x = x⁻ + K (z − H x⁻)</text><line x1="300.0" y1="116.0" x2="412.0" y2="116.0" stroke="#9aa6b6" stroke-width="2"/><polygon points="420.0,116.0 413.1,120.0 413.1,112.0" fill="#9aa6b6"/><text x="360.0" y="106.0" fill="#9aa6b6" font-size="12" text-anchor="middle" font-weight="400" font-style="italic">a priori</text><text x="360.0" y="138.0" fill="#3987e5" font-size="12" text-anchor="middle" font-weight="400" font-family="JetBrains Mono, monospace">x⁻, P⁻</text><line x1="525.0" y1="162.0" x2="525.0" y2="217.0" stroke="#9aa6b6" stroke-width="2"/><line x1="525.0" y1="217.0" x2="195.0" y2="217.0" stroke="#9aa6b6" stroke-width="2"/><line x1="195.0" y1="217.0" x2="195.0" y2="170.0" stroke="#9aa6b6" stroke-width="2"/><polygon points="195.0,162.0 199.0,168.9 191.0,168.9" fill="#9aa6b6"/><text x="360.0" y="237.0" fill="#35c98b" font-size="12.5" text-anchor="middle" font-weight="400" font-style="italic">a posteriori  x, P  → devient l'état du cycle suivant</text><line x1="525.0" y1="22.0" x2="525.0" y2="62.0" stroke="#f0a44f" stroke-width="2"/><polygon points="525.0,70.0 521.0,63.1 529.0,63.1" fill="#f0a44f"/><text x="595.0" y="18.0" fill="#f0a44f" font-size="12.5" text-anchor="middle" font-weight="600">mesure z (capteur)</text><line x1="195.0" y1="22.0" x2="195.0" y2="62.0" stroke="#34d1bf" stroke-width="2"/><polygon points="195.0,70.0 191.0,63.1 199.0,63.1" fill="#34d1bf"/><text x="137.0" y="18.0" fill="#34d1bf" font-size="12.5" text-anchor="middle" font-weight="600">commande u</text></svg>
