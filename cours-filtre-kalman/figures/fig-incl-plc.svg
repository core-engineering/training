<svg viewBox="0 0 720 360" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, sans-serif" role="img"><rect x="30.0" y="50.0" width="660.0" height="210.0" rx="12" fill="none" stroke="#3a4653" stroke-width="1.4" opacity="1.00"/><text x="46.0" y="40.0" fill="#9aa6b6" font-size="12.5" text-anchor="start" font-weight="600">OB cyclique (période dt fixe)  —  appelé 1×/cycle</text><rect x="250.0" y="80.0" width="300.0" height="138.0" rx="10" fill="#10201d" stroke="#35c98b" stroke-width="1.6" opacity="1.00"/><text x="400.0" y="104.0" fill="#35c98b" font-size="14" text-anchor="middle" font-weight="700">FB "IncliVitesse"</text><text x="400.0" y="130.0" fill="#cfe3ff" font-size="13" text-anchor="middle" font-weight="400" font-family="JetBrains Mono, monospace">x⁻ = F·x + B·u</text><text x="400.0" y="152.0" fill="#d6f5e6" font-size="13" text-anchor="middle" font-weight="400" font-family="JetBrains Mono, monospace">y  = z − H·x⁻</text><text x="400.0" y="174.0" fill="#d6f5e6" font-size="13" text-anchor="middle" font-weight="400" font-family="JetBrains Mono, monospace">x  = x⁻ + K∞·y</text><text x="400.0" y="200.0" fill="#9fe9cf" font-size="11.5" text-anchor="middle" font-weight="400" font-style="italic">gains K∞ = constantes (α, β)</text><line x1="70.0" y1="130.0" x2="242.0" y2="130.0" stroke="#f0a44f" stroke-width="2"/><polygon points="250.0,130.0 243.1,134.0 243.1,126.0" fill="#f0a44f"/><text x="72.0" y="118.0" fill="#f0a44f" font-size="12" text-anchor="start" font-weight="600">z  inclinomètre</text><line x1="70.0" y1="185.0" x2="242.0" y2="185.0" stroke="#34d1bf" stroke-width="2"/><polygon points="250.0,185.0 243.1,189.0 243.1,181.0" fill="#34d1bf"/><text x="72.0" y="205.0" fill="#34d1bf" font-size="12" text-anchor="start" font-weight="600">u  commande</text><line x1="550.0" y1="150.0" x2="652.0" y2="150.0" stroke="#35c98b" stroke-width="2"/><polygon points="660.0,150.0 653.1,154.0 653.1,146.0" fill="#35c98b"/><text x="598.0" y="138.0" fill="#35c98b" font-size="12.5" text-anchor="middle" font-weight="700">ω estimé</text><text x="598.0" y="166.0" fill="#9aa6b6" font-size="11" text-anchor="middle" font-weight="400" font-style="italic">→ régulation</text><line x1="505.0" y1="218.0" x2="505.0" y2="238.0" stroke="#9aa6b6" stroke-width="1.6"/><line x1="505.0" y1="238.0" x2="295.0" y2="238.0" stroke="#9aa6b6" stroke-width="1.6"/><line x1="295.0" y1="238.0" x2="295.0" y2="225.0" stroke="#9aa6b6" stroke-width="1.6"/><polygon points="295.0,218.0 298.5,224.1 291.5,224.1" fill="#9aa6b6"/><text x="400.0" y="254.0" fill="#9aa6b6" font-size="10.5" text-anchor="middle" font-weight="400" font-style="italic">état x mémorisé (statique du FB) → cycle suivant</text><rect x="30.0" y="290.0" width="660.0" height="40.0" rx="8" fill="#151a22" stroke="#f4c15b" stroke-width="1.2" opacity="1.00"/><text x="50.0" y="308.0" fill="#f4c15b" font-size="12" text-anchor="start" font-weight="700">Hors ligne (une seule fois) :</text><text x="50.0" y="324.0" fill="#9aa6b6" font-size="11" text-anchor="start" font-weight="400">résoudre l'équation de Riccati (DARE) → gain constant K∞. Aucune matrice à inverser en ligne.</text></svg>
