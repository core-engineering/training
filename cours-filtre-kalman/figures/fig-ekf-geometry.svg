<svg viewBox="0 0 720 380" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, sans-serif" role="img"><rect x="258.0" y="40.0" width="144.0" height="30.0" rx="6" fill="#151a22" stroke="#3a4653" stroke-width="1.3" opacity="1.00"/><text x="330.0" y="58.0" fill="#9aa6b6" font-size="11.5" text-anchor="middle" font-weight="600">plateforme + caméra</text><circle cx="370.00" cy="55.00" r="4.00" fill="#3987e5" opacity="1.00" stroke="none" stroke-width="0"/><circle cx="384.00" cy="55.00" r="4.00" fill="#3987e5" opacity="1.00" stroke="none" stroke-width="0"/><text x="416.0" y="59.0" fill="#3987e5" font-size="10.5" text-anchor="start" font-weight="400">2 inclinos → θ, φ</text><line x1="330.0" y1="72.0" x2="330.0" y2="350.0" stroke="#9aa6b6" stroke-width="1.2" stroke-dasharray="4 5"/><text x="336.0" y="344.0" fill="#9aa6b6" font-size="10.5" text-anchor="start" font-weight="400">verticale (gravité)</text><line x1="330.0" y1="72.0" x2="423.7" y2="303.8" stroke="#34d1bf" stroke-width="1.6" stroke-dasharray="2 3"/><text x="429.7" y="303.8" fill="#34d1bf" font-size="10.5" text-anchor="start" font-weight="400">axe optique (tilt θ)</text><path d="M 330 106 A 34 34 0 0 0 342.7 103.5" fill="none" stroke="#34d1bf" stroke-width="1.3"/><text x="341.0" y="102.0" fill="#34d1bf" font-size="12" text-anchor="middle" font-weight="700" font-family="JetBrains Mono, monospace">θ</text><circle cx="535.00" cy="320.00" r="7.00" fill="#35c98b" opacity="1.00" stroke="none" stroke-width="0"/><text x="549.0" y="318.0" fill="#35c98b" font-size="12" text-anchor="start" font-weight="700">cible</text><text x="549.0" y="334.0" fill="#35c98b" font-size="10.5" text-anchor="start" font-weight="400">(px, py) relative</text><line x1="330.0" y1="72.0" x2="535.0" y2="320.0" stroke="#c3ccd8" stroke-width="1.6"/><path d="M 330 128 A 56 56 0 0 0 365.7 115.2" fill="none" stroke="#c3ccd8" stroke-width="1.2"/><text x="396.0" y="164.0" fill="#c3ccd8" font-size="11" text-anchor="start" font-weight="400">